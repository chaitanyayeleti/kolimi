[package]
name = "kolimi-mls"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "OpenMLS spike for Kolimi group E2EE (RFC 9420)"

[dependencies]
openmls = { version = "0.9", features = ["openmls_rust_crypto", "js"] }
openmls_rust_crypto = "0.6"
openmls_basic_credential = "0.6"

[profile.release]
lto = "thin"

# Some transitive dependencies still use getrandom 0.2; on wasm its `js`
# feature is required (feature unification enables it for the whole graph).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_v2 = { package = "getrandom", version = "0.2", features = ["js"] }
