[package]
name = "kolimi-mls"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "OpenMLS spike for Kolimi group E2EE (RFC 9420)"

[dependencies]
openmls = { version = "0.9", features = ["openmls_rust_crypto", "js"] }
openmls_rust_crypto = "0.6"
openmls_basic_credential = "0.6"
base64 = "0.23"
chacha20poly1305 = "0.10"
getrandom = { version = "0.2", features = ["js"] }
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"

