# cargo-audit configuration.
#
# Both advisories are accepted, upstream-blocked risks, not exploitable
# vulnerabilities. See docs/known-advisories.md for the analysis and the
# conditions under which to revisit. cargo-audit already treats them as
# allowed warnings; listing them here makes the acceptance explicit and
# keeps `cargo audit --deny warnings` green.
[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste (unmaintained) via the Leptos UI stack
    "RUSTSEC-2026-0253", # lru (unsound) via tantivy
]
