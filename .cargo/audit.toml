# cargo-audit configuration.
#
# The advisories below are accepted, upstream-blocked risks, not exploitable
# vulnerabilities. See docs/known-advisories.md for the analysis and the
# conditions under which to revisit. Listing them here makes the acceptance
# explicit and keeps `cargo deny` green. `cargo audit` runs without
# `--deny warnings`; the unmaintained-crate warnings it reports are documented
# in docs/known-advisories.md.
[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste (unmaintained) via the Leptos UI stack
    "RUSTSEC-2026-0253", # lru (unsound) via tantivy
    "RUSTSEC-2026-0387", # crypto-bigint timing (P-curve HPKE not used)
    "RUSTSEC-2026-0330", # libcrux-kem optional backend, not built
    "RUSTSEC-2026-0331", # libcrux-kem optional backend, not built
]
