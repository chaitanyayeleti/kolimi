[package]
name = "kolimi-tray"
description = "Kolimi desktop tray: background sync for a local directory"
version = "0.1.11"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/chaitanyayeleti/kolimi"
rust-version = "1.89"

# Deliberately its own workspace: the tray pulls the Tauri/webkit stack,
# which the server workspace does not need to build or lint.
[workspace]

[dependencies]
kolimi-sync = { version = "0.1.11", path = "../../crates/kolimi-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["time"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
