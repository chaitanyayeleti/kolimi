<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kolimi — Accounts &amp; Sync</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">K</span>
      <span class="brand-text">
        <strong>Kolimi</strong>
        <span>Accounts &amp; Sync</span>
      </span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme" type="button" aria-label="Toggle theme" title="Toggle theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button class="btn primary" id="sync-now" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 5v6h-6"/></svg>
        <span>Sync now</span>
      </button>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <div>
        <h1>Accounts &amp; Sync</h1>
        <p>Sign in to servers and choose which local folders stay in sync.</p>
      </div>
      <span class="pill" id="account-count">0 accounts</span>
    </section>

    <div id="accounts" class="stack"></div>

    <section class="card add-account-card">
      <details id="add-account">
        <summary class="add-summary">
          <span class="summary-mark" aria-hidden="true">+</span>
          <span class="summary-text">
            <strong>Add account</strong>
            <small>Connect another Kolimi server</small>
          </span>
        </summary>
        <form id="signin-form" class="form-grid" autocomplete="on">
          <label class="field span-2">
            <span>Server URL</span>
            <input id="new-server" placeholder="https://cloud.example.com" autocomplete="url" required>
          </label>
          <label class="field">
            <span>Username</span>
            <input id="new-username" autocomplete="username" required>
          </label>
          <label class="field">
            <span>Password</span>
            <input id="new-password" type="password" autocomplete="current-password" required>
          </label>
          <div class="form-actions span-2">
            <button class="btn primary" type="submit">Sign in</button>
          </div>
        </form>
      </details>
    </section>

    <section class="card settings-card">
      <div class="setting-row">
        <div class="setting-copy">
          <strong>Start Kolimi on login</strong>
          <small>Keeps your folders synced in the background.</small>
        </div>
        <label class="switch" aria-label="Start Kolimi on login">
          <input type="checkbox" id="autostart">
          <span class="switch-track" aria-hidden="true"></span>
        </label>
      </div>
    </section>

    <footer class="page-foot">Keys stay on this device. The server never receives your passphrase.</footer>
  </main>
</div>

<div id="msg" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
