[package]
name = "kolimi-desktop"
description = "Kolimi desktop client: native window, background sync, first-run setup"
version = "0.1.39"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/chaitanyayeleti/kolimi"
rust-version = "1.96"

# Deliberately its own workspace: the desktop client pulls the Tauri/webkit
# stack, which the server workspace does not need to build or lint.
[workspace]

[dependencies]
keyring = { version = "4", features = ["apple-native-keyring-store"] }
kolimi-sync = { version = "0.1.39", path = "../../crates/kolimi-sync", features = ["keystore"] }
libc = "0.2"
notify-rust = "4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time"] }
url = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
