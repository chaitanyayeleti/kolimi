apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kolimi.fullname" . }}
  labels:
    {{- include "kolimi.labels" . | nindent 4 }}
spec:
  replicas: {{ .replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "kolimi.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kolimi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: KOLIMI_DATA
              value: /data
            - name: KOLIMI_BIND
              value: 0.0.0.0:8080
            - name: KOLIMI_ORIGIN
              value: {{ .Values.origin | quote }}
            - name: KOLIMI_SECURE_COOKIES
              value: {{ .Values.secureCookies | quote }}
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kolimi.fullname" . }}
        {{- else }}
          emptyDir: {}
        {{- end }}
