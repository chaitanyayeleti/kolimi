# Kolimi with Docker Compose. Adjust KOLIMI_ORIGIN to the URL you visit
# (it must match for passkeys).
services:
  kolimi:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    # Pull the published image (`docker compose pull`), or build locally
    # (`docker compose up --build`).
    image: ghcr.io/chaitanyayeleti/kolimi:0.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KOLIMI_ORIGIN: http://localhost:8080
      KOLIMI_SECURE_COOKIES: "false"
      RUST_LOG: info
    volumes:
      - kolimi-data:/data

volumes:
  kolimi-data:
