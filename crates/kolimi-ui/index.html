<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Kolimi</title>
    <link rel="icon" href="/app/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/app/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <link rel="stylesheet" href="/app/style.css" />
    <link rel="modulepreload" href="/app/app.js" />
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-live="polite">
        <img class="boot-mark" src="/app/favicon.svg" alt="" width="56" height="56" />
        <p class="boot-title">Kolimi</p>
        <span class="boot-spinner" aria-hidden="true"></span>
        <p class="boot-hint">Loading your workspace…</p>
      </div>
    </div>
    <noscript>
      <p class="boot-hint">
        Kolimi needs JavaScript and WebAssembly. Enable them and reload.
      </p>
    </noscript>
    <!-- External bootstrap: the Content-Security-Policy allows only
         'self' scripts, so the wasm module must not be initialised from
         an inline script. -->
    <script type="module" src="/app/bootstrap.js"></script>
  </body>
</html>
