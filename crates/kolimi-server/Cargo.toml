[package]
name = "kolimi-server"
description = "Kolimi server — a pure-Rust, single-binary alternative to Nextcloud"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
clap.workspace = true
futures-util.workspace = true
kolimi-auth.workspace = true
kolimi-chunk.workspace = true
kolimi-db.workspace = true
kolimi-plugins.workspace = true
kolimi-preview.workspace = true
kolimi-search.workspace = true
kolimi-store.workspace = true
kolimi-vfs.workspace = true
kolimi-webdav.workspace = true
mime_guess.workspace = true
percent-encoding.workspace = true
prometheus.workspace = true
qrcode.workspace = true
rpassword.workspace = true
rust-embed = "8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
base64.workspace = true
http-body-util.workspace = true
image.workspace = true
kolimi-crypto.workspace = true
kolimi-sync.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs"] }
tempfile.workspace = true
tower.workspace = true
url.workspace = true
webauthn-authenticator-rs = { version = "0.5", default-features = false, features = ["softpasskey"] }

[package.metadata.deb]
name = "kolimi-server"
maintainer = "Kolimi contributors <chaitanyachowdary125@live.com>"
copyright = "2026 Kolimi contributors"
section = "net"
priority = "optional"
depends = "$auto"
recommends = "systemd"
assets = [
    ["target/release/kolimi-server", "usr/bin/", "755"],
    ["target/release/kolimi-sync", "usr/bin/", "755"],
    ["../../packaging/systemd/kolimi.service", "usr/lib/systemd/system/kolimi.service", "644"],
    ["../../packaging/systemd/kolimi.sysusers", "usr/lib/sysusers.d/kolimi.conf", "644"],
    ["../../packaging/systemd/kolimi.tmpfiles", "usr/lib/tmpfiles.d/kolimi.conf", "644"],
    ["../../packaging/systemd/kolimi.env.example", "etc/kolimi/kolimi.env.example", "644"],
    ["../../README.md", "usr/share/doc/kolimi-server/README.md", "644"],
]
maintainer-scripts = "../../packaging/deb"
