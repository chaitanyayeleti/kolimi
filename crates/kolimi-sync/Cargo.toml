[package]
name = "kolimi-sync"
description = "Kolimi desktop sync core: bidirectional delta sync with the server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "kolimi_sync"
path = "src/lib.rs"

[[bin]]
name = "kolimi-sync"
path = "src/main.rs"

[features]
# Store the CLI device key in the OS keystore (Secret Service / Keychain /
# Credential Manager) instead of the plaintext `.kolimi/device.json`. Off by
# default so the static/musl release builds are unaffected; when the feature
# is on but no keystore is reachable, the key falls back to the file.
keystore = ["dep:keyring"]

[dependencies]
base64.workspace = true
clap.workspace = true
keyring = { version = "4", optional = true }
rpassword.workspace = true
kolimi-chunk.workspace = true
kolimi-crypto.workspace = true
kolimi-mls.workspace = true
percent-encoding.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"
