[package]
name = "kolimi-crypto"
description = "Client-side end-to-end encryption primitives for Kolimi (RFC 0007)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
argon2.workspace = true
base64.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
hkdf.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

[dev-dependencies]
hex.workspace = true
serde_json.workspace = true

# Browser (wasm) support: getrandom 0.4 uses the `wasm_js` backend (enabled
# above) with the `getrandom_backend` cfg from `.cargo/config.toml`; the
# transitive getrandom 0.2 (via the KDF/dalek stack) needs its `js` backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
