[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0253", reason = "lru 0.16.4 via tantivy 0.26 (no semver-compatible fix; patched only in >= 0.18.2). The unsoundness requires a panicking Drop on a cache *key* during LruCache::pop with unwinding catch_unwind; tantivy's cache keys are plain (Field, u64)/String values whose Drop cannot panic. Revisit when tantivy moves to lru 0.18." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "libssh2-sys" },
]
skip = [
    { crate = "openssl", reason = "forced by webauthn-rs-core for WebAuthn signature verification only; not used for TLS or hashing (rustls/RustCrypto). Prefer rustls for any new dependency; revisit when upstream offers a pure-Rust backend" },
    { crate = "openssl-sys", reason = "transitive via webauthn-rs-core; see openssl skip entry" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
