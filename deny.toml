[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "libssh2-sys" },
]
skip = [
    { crate = "openssl", reason = "forced by webauthn-rs-core for WebAuthn signature verification only; not used for TLS or hashing (rustls/RustCrypto); revisit when upstream offers a pure-Rust backend" },
    { crate = "openssl-sys", reason = "transitive via webauthn-rs-core; see openssl skip entry" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
