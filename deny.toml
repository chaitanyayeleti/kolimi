[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0253", reason = "lru 0.16.4 via tantivy 0.26 (no semver-compatible fix; patched only in >= 0.18.2). The unsoundness requires a panicking Drop on a cache *key* during LruCache::pop with unwinding catch_unwind; tantivy's cache keys are plain (Field, u64)/String values whose Drop cannot panic. Revisit when tantivy moves to lru 0.18." },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is unmaintained (a compile-time proc-macro; no known vulnerability). It is transitive via Leptos 0.8 (either_of/tachys/reactive_graph); stable Leptos has not yet adopted the maintained fork `pastey`. Not flagged by cargo-deny today (transitive + unmaintained=workspace); listed for when that scope changes. Revisit when Leptos switches to pastey." },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 timing variability via hpke-rs-rust-crypto (P-256/P-384 HPKE). Kolimi's MLS ciphersuite is X25519/Ed25519/AES128GCM; no P-curve HPKE path is used. No semver fix in elliptic-curve 0.13; revisit when hpke-rs moves to elliptic-curve 0.14/crypto-bigint 0.7." },
    { id = "RUSTSEC-2026-0330", reason = "libcrux-kem 0.0.9 is an optional hpke-rs backend that is not enabled (no libcrux feature) and is absent from the host build graph; lockfile-only. Revisit when openmls/hpke-rs updates or prunes the optional entry." },
    { id = "RUSTSEC-2026-0331", reason = "libcrux-kem 0.0.9 is an optional hpke-rs backend that is not enabled (no libcrux feature) and is absent from the host build graph; lockfile-only. Revisit when openmls/hpke-rs updates or prunes the optional entry." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "libssh2-sys" },
]
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
