name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy -p kolimi-ui --target wasm32-unknown-unknown -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  fuzz:
    name: fuzz (30s smoke)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build
        working-directory: fuzz
      - run: cargo fuzz run chunk_roundtrip -- -max_total_time=30 -max_len=4194304
        working-directory: fuzz
      - run: cargo fuzz run preview_image -- -max_total_time=30 -max_len=1048576
        working-directory: fuzz
      - run: cargo fuzz run e2ee_decrypt -- -max_total_time=30 -max_len=4096
        working-directory: fuzz

  ui:
    name: ui (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: chmod +x scripts/build-ui.sh && scripts/build-ui.sh
      - run: cargo build --release -p kolimi-server
      - name: Smoke test embedded assets
        run: |
          KOLIMI_DATA=./kolimi-data ./target/release/kolimi-server user add smoke --password smoke-pass-123
          KOLIMI_DATA=./kolimi-data ./target/release/kolimi-server serve --bind 127.0.0.1:8080 &
          sleep 2
          curl -fsS http://127.0.0.1:8080/app/ | grep -q 'id="app"'
          curl -fsS http://127.0.0.1:8080/app/ | grep -q 'src="/app/bootstrap.js"'
          # An inline script would be blocked by the CSP (script-src 'self').
          if curl -fsS http://127.0.0.1:8080/app/ | grep -q '<script type="module">'; then
            echo "error: inline script would be blocked by the CSP"; exit 1
          fi
          curl -fsS -o /dev/null http://127.0.0.1:8080/app/bootstrap.js
          curl -fsS -o /dev/null http://127.0.0.1:8080/app/app.js
          curl -fsS -o /dev/null -w '%{content_type}' http://127.0.0.1:8080/app/app_bg.wasm | grep -q application/wasm
          curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/s/sometoken | grep -q 200
          kill %1

  ffi:
    name: ffi (bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kolimi-ffi
      - name: Generate bindings (Kotlin, Swift, Python)
        run: |
          cargo build -p kolimi-ffi
          for lang in kotlin swift python; do
            cargo run -q -p kolimi-ffi --bin uniffi-bindgen -- generate \
              --library target/debug/libkolimi_ffi.so --language "$lang" \
              --out-dir "target/bindings/$lang"
          done
          test -s target/bindings/kotlin/uniffi/kolimi_ffi/kolimi_ffi.kt
          test -s target/bindings/swift/kolimi_ffi.swift
          test -s target/bindings/python/kolimi_ffi.py

  desktop:
    name: desktop (Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/kolimi-desktop
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo build --manifest-path apps/kolimi-desktop/Cargo.toml

  packaging:
    name: packaging (deb, helm, install smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Stage the web UI (embedded into the server binary)
        run: chmod +x scripts/build-ui.sh && scripts/build-ui.sh
      - name: Build release binaries
        run: cargo build --release --locked -p kolimi-server -p kolimi-sync
      - name: One-command install to a working share link
        run: |
          chmod +x scripts/install.sh
          ./scripts/install.sh --binary target/release/kolimi-server \
            --sync target/release/kolimi-sync \
            --prefix "$RUNNER_TEMP/kolimi/usr" --data-dir "$RUNNER_TEMP/kolimi/data" \
            --no-systemd --admin admin --password install-smoke-pass-123
          KOLIMI_DATA="$RUNNER_TEMP/kolimi/data" "$RUNNER_TEMP/kolimi/usr/bin/kolimi-server" serve \
            --bind 127.0.0.1:18080 --origin http://localhost:18080 &
          sleep 2
          curl -fsS http://127.0.0.1:18080/healthz
          # The install must ship a usable UI, not just the placeholder.
          curl -fsS -o /dev/null -w '%{content_type}' \
            http://127.0.0.1:18080/app/app_bg.wasm | grep -q application/wasm
          curl -fsS -o /dev/null http://127.0.0.1:18080/app/bootstrap.js
          printf 'shared via one-command install' > "$RUNNER_TEMP/doc.txt"
          curl -fsS -u admin:install-smoke-pass-123 -T "$RUNNER_TEMP/doc.txt" \
            http://127.0.0.1:18080/dav/doc.txt -o /dev/null
          LINK=$(curl -fsS -u admin:install-smoke-pass-123 -X POST \
            -H 'Content-Type: application/json' \
            -d '{"path":"/doc.txt","kind":"link"}' \
            http://127.0.0.1:18080/api/shares)
          URL=$(echo "$LINK" | python3 -c 'import sys,json; print(json.load(sys.stdin)["url"])')
          PW=$(echo "$LINK" | python3 -c 'import sys,json; print(json.load(sys.stdin)["password"])')
          TOKEN=${URL#/s/}
          JAR="$RUNNER_TEMP/cookies.txt"
          curl -fsS -c "$JAR" -X POST -H 'Content-Type: application/json' \
            -d "{\"password\":\"$PW\"}" "http://127.0.0.1:18080/public/$TOKEN/unlock" -o /dev/null
          curl -fsS -b "$JAR" "http://127.0.0.1:18080/public/$TOKEN/download" | grep -q 'one-command install'
          kill %1
      - name: Build .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb -p kolimi-server --no-build
          ls target/debian/*.deb
      - name: Lint Helm chart
        uses: azure/setup-helm@v4
      - run: helm lint packaging/helm/kolimi && helm template packaging/helm/kolimi > /dev/null

  perf:
    name: perf (load gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Stage the web UI (so the size gate measures the shipped binary)
        run: chmod +x scripts/build-ui.sh && scripts/build-ui.sh
      - name: Load gates (release)
        run: cargo test --release --locked -p kolimi-server --test load -- --ignored --nocapture
      - name: Binary size gate (< 50 MB)
        run: |
          cargo build --release --locked -p kolimi-server
          size=$(stat -c%s target/release/kolimi-server)
          echo "kolimi-server: $((size / 1024 / 1024)) MiB"
          test "$size" -lt 52428800

  vet:
    name: cargo-vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
      - run: cargo install cargo-vet --locked
      - run: cargo vet --locked

  litmus:
    name: litmus (WebDAV compliance)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev zlib1g-dev
      - name: Cache neon + litmus builds
        uses: actions/cache@v4
        with:
          path: /tmp/kolimi-litmus-build
          key: litmus-${{ runner.os }}-neon0.29.6-litmus0.13
      - run: chmod +x scripts/litmus.sh && scripts/litmus.sh
