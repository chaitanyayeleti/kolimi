name: Desktop Release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. desktop-v0.1.14)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
          - name: macOS
            os: macos-latest
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/kolimi-desktop
          key: desktop-release-${{ matrix.name }}
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Check the desktop lockfile is current
        run: cargo metadata --locked --manifest-path apps/kolimi-desktop/Cargo.toml
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      # Tests run in CI for the tagged commit; the release job only packages.
      - name: Build bundles (${{ matrix.bundles }})
        working-directory: apps/kolimi-desktop
        run: cargo tauri build --bundles ${{ matrix.bundles }}
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${{ matrix.name }}" in
            Linux)
              cp apps/kolimi-desktop/target/release/bundle/deb/*.deb dist/
              cp apps/kolimi-desktop/target/release/bundle/appimage/*.AppImage dist/
              ;;
            Windows)
              cp apps/kolimi-desktop/target/release/bundle/msi/*.msi dist/
              cp apps/kolimi-desktop/target/release/bundle/nsis/*.exe dist/
              ;;
            macOS)
              version="${{ inputs.tag || github.ref_name }}"
              version="${version#desktop-v}"
              arch="$(uname -m)"
              cp apps/kolimi-desktop/target/release/bundle/dmg/*.dmg dist/
              # Expand *.app inside the bundle directory; `tar -C` does not
              # affect shell glob expansion.
              (
                cd apps/kolimi-desktop/target/release/bundle/macos
                tar -czf "$GITHUB_WORKSPACE/dist/kolimi-desktop_${version}_${arch}.app.tar.gz" *.app
              )
              ;;
          esac
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish desktop release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "Kolimi Desktop ${{ inputs.tag || github.ref_name }}"
          body: "Native Kolimi desktop client — Linux `.deb`/AppImage, Windows `.msi`/NSIS, macOS `.app`/`.dmg`. Windows and macOS builds are unsigned until signing certificates are configured."
          files: dist/*
          fail_on_unmatched_files: true

  aur:
    name: AUR update (kolimi-desktop)
    needs: publish
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check for AUR key
        id: gate
        run: |
          if [ -n "$AUR_SSH_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "AUR_SSH_KEY secret not set; skipping AUR publish."
          fi
      - if: steps.gate.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - if: steps.gate.outputs.present == 'true'
        name: Install tools
        run: pacman -Sy --noconfirm git openssh curl
      - if: steps.gate.outputs.present == 'true'
        name: Bump PKGBUILD and .SRCINFO
        working-directory: packaging/aur/kolimi-desktop
        run: |
          version="${RELEASE_TAG#desktop-v}"
          sed -i "s/^pkgver=.*/pkgver=$version/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          url="https://github.com/chaitanyayeleti/kolimi/archive/refs/tags/desktop-v$version.tar.gz"
          sum=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          sed -i "s/^sha256sums=.*/sha256sums=('$sum')/" PKGBUILD
          useradd -m builder || true
          chown -R builder .
          runuser -u builder -- makepkg --printsrcinfo > .SRCINFO
      - if: steps.gate.outputs.present == 'true'
        name: Push to AUR
        run: |
          version="${RELEASE_TAG#desktop-v}"
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t rsa,ecdsa,ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null || true
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          remote="ssh://aur@aur.archlinux.org/kolimi-desktop.git"
          # First release: the AUR package does not exist yet, so create it.
          if ! git clone "$remote" /tmp/aur 2>/dev/null; then
            mkdir -p /tmp/aur
            git -C /tmp/aur init -q -b master
            git -C /tmp/aur remote add origin "$remote"
          fi
          cp packaging/aur/kolimi-desktop/PKGBUILD /tmp/aur/PKGBUILD
          cp packaging/aur/kolimi-desktop/.SRCINFO /tmp/aur/.SRCINFO
          cd /tmp/aur
          git config user.name "Kolimi CI"
          git config user.email "ci@kolimi.local"
          git add PKGBUILD .SRCINFO
          git commit -m "kolimi-desktop $version" || echo "no changes to push"
          git push --set-upstream origin master
