name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake musl-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Stage the web UI (embedded into the server binary)
        run: chmod +x scripts/build-ui.sh && scripts/build-ui.sh
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p kolimi-server -p kolimi-sync
      - name: Package
        run: |
          NAME="kolimi-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/kolimi-server" "dist/$NAME/"
          cp "target/${{ matrix.target }}/release/kolimi-sync" "dist/$NAME/"
          cp README.md LICENSE "dist/$NAME/"
          cp packaging/systemd/kolimi.service packaging/systemd/kolimi.env.example "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
      - name: Build .deb (gnu only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/kolimi-server" target/release/kolimi-server
          cp "target/${{ matrix.target }}/release/kolimi-sync" target/release/kolimi-sync
          cargo install cargo-deb --locked
          cargo deb -p kolimi-server --no-build --output dist/
      - name: SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --no-build-deps \
            --manifest-path crates/kolimi-server/Cargo.toml
          cp crates/kolimi-server/kolimi-server.cdx.json \
            "dist/kolimi-${{ matrix.target }}.sbom.cdx.json"
      - name: Sign artifact (cosign keyless)
        uses: sigstore/cosign-installer@v3
      - run: |
          NAME="kolimi-${{ matrix.target }}"
          cosign sign-blob --yes --output-signature "dist/$NAME.tar.gz.sig" \
            --output-certificate "dist/$NAME.tar.gz.pem" "dist/$NAME.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: kolimi-${{ matrix.target }}
          path: dist/*

  container:
    name: container (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          # arm64 is emulated here (slow for the wasmtime build); add it via a
          # native arm runner later.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: helm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: azure/setup-helm@v4
      - run: |
          mkdir -p dist
          helm package packaging/helm/kolimi --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: helm
          path: dist/*

  publish:
    name: publish release
    needs: [build, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
