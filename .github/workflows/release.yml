name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.1)"
        required: true

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            deps: cmake libssl-dev
            deb: true
            # glibc builds get the CLI OS-keystore backend; the static musl
            # build does not (it uses the `0600` device-file fallback).
            sync_features: --features kolimi-sync/keystore
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
            deps: cmake musl-tools
            cc: musl-gcc
            deb: false
            sync_features: ""
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
            deps: cmake libssl-dev
            deb: false
            sync_features: --features kolimi-sync/keystore
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.deps }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Stage the web UI (embedded into the server binary)
        run: chmod +x scripts/build-ui.sh && scripts/build-ui.sh
      - name: Build
        env:
          # musl statically links OpenSSL (vendored); tell the C toolchain.
          CC_x86_64_unknown_linux_musl: ${{ matrix.cc }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p kolimi-server -p kolimi-sync ${{ matrix.sync_features }}
      - name: Package
        run: |
          NAME="kolimi-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/kolimi-server" "dist/$NAME/"
          cp "target/${{ matrix.target }}/release/kolimi-sync" "dist/$NAME/"
          cp README.md LICENSE "dist/$NAME/"
          cp packaging/systemd/kolimi.service packaging/systemd/kolimi.env.example "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
      - name: Build .deb (x86_64 gnu only)
        if: matrix.deb
        run: |
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/kolimi-server" target/release/kolimi-server
          cp "target/${{ matrix.target }}/release/kolimi-sync" target/release/kolimi-sync
          cargo install cargo-deb --locked
          cargo deb -p kolimi-server --no-build --output dist/
      - name: SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --no-build-deps \
            --manifest-path crates/kolimi-server/Cargo.toml
          cp crates/kolimi-server/kolimi-server.cdx.json \
            "dist/kolimi-${{ matrix.target }}.sbom.cdx.json"
      - name: Sign artifact (cosign keyless)
        uses: sigstore/cosign-installer@v3
      - run: |
          NAME="kolimi-${{ matrix.target }}"
          cosign sign-blob --yes --output-signature "dist/$NAME.tar.gz.sig" \
            --output-certificate "dist/$NAME.tar.gz.pem" "dist/$NAME.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: kolimi-${{ matrix.target }}
          path: dist/*

  container:
    name: container (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          # Native arm runner: building the wasmtime tree under QEMU is far
          # too slow, so arm64 gets its own runner.
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          # The digest's "sha256:" prefix is not a valid artifact filename.
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  container-manifest:
    name: container (multi-arch manifest)
    runs-on: ubuntu-latest
    needs: [container]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Create and push the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

  helm:
    name: helm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: azure/setup-helm@v4
      - name: Set the chart version from the release tag
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          version="${tag#v}"
          sed -i "s/^version:.*/version: ${version}/" packaging/helm/kolimi/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${version}\"/" packaging/helm/kolimi/Chart.yaml
          grep -q "^version: ${version}$" packaging/helm/kolimi/Chart.yaml
          grep -q "^appVersion: \"${version}\"$" packaging/helm/kolimi/Chart.yaml
      - run: |
          mkdir -p dist
          helm package packaging/helm/kolimi --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: helm
          path: dist/*

  aur:
    name: AUR update
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
    steps:
      - name: Check for AUR key
        id: gate
        run: |
          if [ -n "$AUR_SSH_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "AUR_SSH_KEY secret not set; skipping AUR publish."
          fi
      - if: steps.gate.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - if: steps.gate.outputs.present == 'true'
        name: Install tools
        run: pacman -Sy --noconfirm git openssh curl
      - if: steps.gate.outputs.present == 'true'
        name: Bump PKGBUILD and .SRCINFO
        run: |
          scripts/aur-bump.sh "${GITHUB_REF_NAME#v}"
          useradd -m builder
          chown -R builder .
          runuser -u builder -- bash -c 'cd packaging/arch && makepkg --printsrcinfo > .SRCINFO'
      - if: steps.gate.outputs.present == 'true'
        name: Push to AUR
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t rsa,ecdsa,ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null || true
          # `accept-new` covers the case where ssh-keyscan was blocked.
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone ssh://aur@aur.archlinux.org/kolimi-server.git /tmp/aur
          cp packaging/arch/PKGBUILD packaging/arch/.SRCINFO /tmp/aur/
          cd /tmp/aur
          git config user.name "Kolimi CI"
          git config user.email "ci@kolimi.local"
          git add PKGBUILD .SRCINFO
          git commit -m "kolimi-server ${GITHUB_REF_NAME}" || echo "no changes to push"
          git push

  publish:
    name: publish release
    needs: [build, helm]
    runs-on: ubuntu-latest
    steps:
      # Only our own artifacts (skip buildx's internal *.dockerbuild record).
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kolimi-*
          path: dist
          merge-multiple: true
      - name: Download Helm chart
        uses: actions/download-artifact@v4
        with:
          name: helm
          path: dist
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
