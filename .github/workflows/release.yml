name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p kolimi-server -p kolimi-sync
      - name: Package
        run: |
          NAME="kolimi-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/kolimi-server" "dist/$NAME/"
          cp "target/${{ matrix.target }}/release/kolimi-sync" "dist/$NAME/"
          cp README.md LICENSE "dist/$NAME/"
          cp packaging/systemd/kolimi.service packaging/systemd/kolimi.env.example "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
      - name: SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --output-file "dist/kolimi-${{ matrix.target }}.sbom.cdx.json"
      - name: Sign artifact (cosign keyless)
        uses: sigstore/cosign-installer@v3
      - run: |
          NAME="kolimi-${{ matrix.target }}"
          cosign sign-blob --yes --output-signature "dist/$NAME.tar.gz.sig" \
            --output-certificate "dist/$NAME.tar.gz.pem" "dist/$NAME.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: kolimi-${{ matrix.target }}
          path: dist/*

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
