[package]
name = "kolimi-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.kolimi-chunk]
path = "../crates/kolimi-chunk"

[dependencies.kolimi-crypto]
path = "../crates/kolimi-crypto"

[dependencies.kolimi-preview]
path = "../crates/kolimi-preview"

[[bin]]
name = "chunk_roundtrip"
path = "fuzz_targets/chunk_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "preview_image"
path = "fuzz_targets/preview_image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "e2ee_decrypt"
path = "fuzz_targets/e2ee_decrypt.rs"
test = false
doc = false
bench = false

[workspace]
