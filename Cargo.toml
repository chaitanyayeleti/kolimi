[workspace]
resolver = "3"
members = [
    "crates/kolimi-auth",
    "crates/kolimi-chunk",
    "crates/kolimi-crypto",
    "crates/kolimi-db",
    "crates/kolimi-ffi",
    "crates/kolimi-preview",
    "crates/kolimi-search",
    "crates/kolimi-server",
    "crates/kolimi-store",
    "crates/kolimi-sync",
    "crates/kolimi-ui",
    "crates/kolimi-vfs",
    "crates/kolimi-webdav",
]
exclude = ["fuzz", "apps/kolimi-tray"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/chaitanyayeleti/kolimi"
rust-version = "1.89"

[workspace.dependencies]
argon2 = "0.6"
chacha20poly1305 = "0.10"
hkdf = "0.12"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.23"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
fastcdc = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png"] }
kolimi-auth = { version = "0.0.1", path = "crates/kolimi-auth" }
kolimi-chunk = { version = "0.0.1", path = "crates/kolimi-chunk" }
kolimi-crypto = { version = "0.0.1", path = "crates/kolimi-crypto" }
kolimi-db = { version = "0.0.1", path = "crates/kolimi-db" }
kolimi-ffi = { version = "0.0.1", path = "crates/kolimi-ffi" }
kolimi-preview = { version = "0.0.1", path = "crates/kolimi-preview" }
kolimi-search = { version = "0.0.1", path = "crates/kolimi-search" }
kolimi-server = { version = "0.0.1", path = "crates/kolimi-server" }
kolimi-store = { version = "0.0.1", path = "crates/kolimi-store" }
kolimi-sync = { version = "0.0.1", path = "crates/kolimi-sync" }
kolimi-vfs = { version = "0.0.1", path = "crates/kolimi-vfs" }
kolimi-webdav = { version = "0.0.1", path = "crates/kolimi-webdav" }
mime_guess = "2"
percent-encoding = "2"
prometheus = "0.14"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
quick-xml = "0.42"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tempfile = "3"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util", "time", "process", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webauthn-rs = { version = "0.5", default-features = false, features = ["danger-allow-state-serialisation"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
